<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Hermes IDE</title>
  <desc id="d">A Cursor-style IDE for Hermes Desktop: Explorer, editor, your running app and the chat, side by side.</desc>
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="95%">
      <stop offset="0" stop-color="#1d2340"/>
      <stop offset="0.7" stop-color="#0f121d"/>
      <stop offset="1" stop-color="#0b0d15"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8fe0"/>
      <stop offset="1" stop-color="#5fa889"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="17.5" fill="none" stroke="#262c45"/>

  <!-- Wordmark -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="128" font-size="30" font-weight="700" fill="url(#glyph)">&lt;/&gt;</text>
    <text x="72" y="192" font-size="64" font-weight="700" fill="#e3e6f2" letter-spacing="-1.5">Hermes IDE</text>
    <text x="74" y="236" font-size="21" fill="#9aa1c0">A Cursor-style IDE for Hermes Desktop.</text>
    <text x="74" y="266" font-size="21" fill="#9aa1c0">Code, the running app and the agent, side by side.</text>
  </g>

  <!-- Window sketch: Explorer | Editor | Browser | Chat -->
  <g transform="translate(612 36) scale(1.13)">
    <rect width="520" height="236" rx="12" fill="#121626" stroke="#2c3352"/>
    <rect width="520" height="22" rx="12" fill="#171c30"/>
    <rect y="12" width="520" height="10" fill="#171c30"/>
    <circle cx="16" cy="11" r="3.5" fill="#3a4266"/>
    <circle cx="28" cy="11" r="3.5" fill="#3a4266"/>
    <circle cx="40" cy="11" r="3.5" fill="#3a4266"/>

    <!-- Column headers -->
    <g fill="#272e4a">
      <rect x="10" y="30" width="34" height="5" rx="2.5"/>
      <rect x="76" y="30" width="30" height="5" rx="2.5"/>
      <rect x="232" y="30" width="36" height="5" rx="2.5"/>
      <rect x="402" y="30" width="44" height="5" rx="2.5"/>
    </g>

    <!-- Explorer -->
    <g fill="#343c60">
      <rect x="10" y="46" width="44" height="5" rx="2.5"/>
      <rect x="16" y="58" width="38" height="5" rx="2.5"/>
      <rect x="10" y="68" width="56" height="11" fill="#1f2540"/>
      <rect x="16" y="71" width="30" height="5" rx="2.5" fill="#6a72a6"/>
      <rect x="16" y="84" width="34" height="5" rx="2.5"/>
      <rect x="16" y="96" width="26" height="5" rx="2.5"/>
      <rect x="10" y="110" width="40" height="5" rx="2.5"/>
      <rect x="10" y="122" width="30" height="5" rx="2.5"/>
      <rect x="10" y="134" width="36" height="5" rx="2.5"/>
    </g>
    <line x1="66" y1="22" x2="66" y2="236" stroke="#2c3352"/>

    <!-- Editor with a reviewed hunk -->
    <g>
      <rect x="76" y="46" width="96" height="5" rx="2.5" fill="#6a72a6"/>
      <rect x="76" y="60" width="120" height="5" rx="2.5" fill="#3e4775"/>
      <rect x="70" y="70" width="146" height="13" fill="#2e1d27"/>
      <rect x="76" y="74" width="104" height="5" rx="2.5" fill="#8a5060"/>
      <rect x="70" y="84" width="146" height="13" fill="#17302a"/>
      <rect x="76" y="88" width="118" height="5" rx="2.5" fill="#4f9a77"/>
      <rect x="76" y="104" width="84" height="5" rx="2.5" fill="#3e4775"/>
      <rect x="76" y="118" width="110" height="5" rx="2.5" fill="#3e4775"/>
      <rect x="76" y="132" width="70" height="5" rx="2.5" fill="#a68b63"/>
      <rect x="76" y="146" width="98" height="5" rx="2.5" fill="#3e4775"/>
      <rect x="76" y="160" width="60" height="5" rx="2.5" fill="#3e4775"/>
    </g>
    <line x1="222" y1="22" x2="222" y2="236" stroke="#2c3352"/>

    <!-- Browser: the running app -->
    <rect x="276" y="29" width="104" height="7" rx="3.5" fill="#1d2239"/>
    <g transform="translate(250 54)">
      <rect width="114" height="150" rx="10" fill="#161a2b" stroke="#2c3352"/>
      <rect x="12" y="14" width="66" height="7" rx="3.5" fill="#a9afcc"/>
      <rect x="12" y="28" width="34" height="4" rx="2" fill="#565d82"/>
      <rect x="12" y="42" width="90" height="14" rx="5" fill="#1d2238"/>
      <rect x="12" y="61" width="90" height="14" rx="5" fill="#1d2238"/>
      <rect x="12" y="80" width="90" height="14" rx="5" fill="#1d2238"/>
      <rect x="12" y="99" width="90" height="14" rx="5" fill="#1d2238"/>
      <rect x="12" y="122" width="90" height="16" rx="6" fill="#2f8a57"/>
    </g>
    <line x1="392" y1="22" x2="392" y2="236" stroke="#2c3352"/>

    <!-- Chat with a picked-element block -->
    <g>
      <rect x="402" y="46" width="106" height="44" rx="7" fill="none" stroke="#3a4266"/>
      <rect x="410" y="55" width="78" height="4" rx="2" fill="#7c80d0"/>
      <rect x="410" y="65" width="88" height="4" rx="2" fill="#454d78"/>
      <rect x="410" y="75" width="62" height="4" rx="2" fill="#454d78"/>
      <rect x="402" y="102" width="96" height="4" rx="2" fill="#454d78"/>
      <rect x="402" y="112" width="84" height="4" rx="2" fill="#454d78"/>
      <rect x="402" y="122" width="58" height="4" rx="2" fill="#4f9a77"/>
      <rect x="400" y="204" width="110" height="20" rx="8" fill="#171c30" stroke="#2c3352"/>
      <rect x="408" y="212" width="54" height="4" rx="2" fill="#7c80d0"/>
    </g>
  </g>
</svg>
