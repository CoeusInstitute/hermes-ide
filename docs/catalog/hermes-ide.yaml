# Catalog entry for NousResearch/hermes-agent: copy to plugin-catalog/hermes-ide.yaml.
# Fill CATALOG_SHA with the full 40-character commit of the release's catalog tag (git rev-parse catalog-v0.6.4^{commit})
# in `sha` and in the image and screenshot URLs.
name: hermes-ide
repo: https://github.com/CoeusInstitute/hermes-ide
sha: CATALOG_SHA
title: Hermes IDE
description: 'Cursor-style IDE for Hermes Desktop: any chat opens in its own IDE window with an Explorer,
  a tabbed CodeMirror editor, workspace search, git status and Quick Open beside the real session chat.
  Finds the project''s web UI, runs its dev server after you trust it, and opens the page in the app''s
  Browser, where an element picker sends elements, their component and source line to the chat. Add to Chat,
  inline edit and agent-edit review (Keep/Undo) are wired to the session. Desktop plugin SDK only (one
  disclosed window-maximize bridge call); backend routes on the agent''s machine; one tool, ide_open; a
  pre_llm_call note and a bundled skill so the agent knows a message comes from the IDE.'
maintainer: CoeusInstitute
tier: community
category: desktop
requires_hermes: ">=0.22.5"
version: "0.6.4"
docs_url: https://github.com/CoeusInstitute/hermes-ide#readme
screenshots:
  - https://raw.githubusercontent.com/CoeusInstitute/hermes-ide/CATALOG_SHA/docs/images/ide-window.png
  - https://raw.githubusercontent.com/CoeusInstitute/hermes-ide/CATALOG_SHA/docs/images/agent-edit-review.png
readme: true
platforms: []
known_issues:
  - "After updating over a running gateway, run hermes gateway restart to load the new backend routes."
  - "Against a remote Hermes backend, a dev server's localhost page is on the remote machine."
capabilities:
  provides_tools: [ide_open]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
